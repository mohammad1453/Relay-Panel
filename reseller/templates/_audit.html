<div class="table-wrap"><table><thead><tr><th>{{ t('time') }}</th><th>{{ t('actor') }}</th><th>{{ t('actor_name') }}</th><th>{{ t('kind') }}</th><th>{{ t('subject') }}</th><th>{{ t('status') }}</th></tr></thead><tbody>{% for e in events %}<tr><td>{{ date(e.created) }}</td><td>{{ e.actor or '—' }}</td><td>{{ e.actor_name or t('system') }}</td><td>{{ t(e.action) }}</td><td>{{ e.subject }}</td><td>{{ t(e.outcome) }}</td></tr>{% else %}<tr><td colspan="6" class="empty">{{ t('empty') }}</td></tr>{% endfor %}</tbody></table></div>
