{% extends 'base.html' %}{% block body %}<div class="heading"><h1>{{ customer.email }}</h1><a class="button" href="/customers/{{ customer.id }}">{{ t('back') }}</a></div>{% if subscription_link %}<section class="panel"><h2>{{ t('subscription_link') }}</h2><div class="link-row"><div><a class="subscription-url" href="{{ subscription_link }}" dir="ltr">{{ subscription_link }}</a><input type="hidden" id="subscription-link" value="{{ subscription_link }}"><button type="button" data-copy="subscription-link" data-copied="{{ t('copied') }}">{{ t('copy') }}</button></div></div></section>{% endif %}<section class="panel"><h2>{{ t('config_uris') }}</h2>{% for link in links %}<div class="link-row"><div><textarea readonly aria-label="{{ t('config_uris') }}" id="connection-{{ loop.index0 }}">{{ link }}</textarea><button type="button" data-copy="connection-{{ loop.index0 }}" data-copied="{{ t('copied') }}">{{ t('copy') }}</button></div></div>{% else %}<p class="muted">{{ t('no_links') }}</p>{% endfor %}</section>{% endblock %}
