name: Release

# A release is published when the VERSION file on main has a version that has
# no GitHub release yet. GitHub creates the vX.Y.Z tag itself. Pushing a
# vX.Y.Z tag by hand, or running this workflow from the Actions tab, also works.
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      replace:
        description: "Rebuild and replace the existing release for the current VERSION (keeps the version number)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "${{ inputs.replace }}" = "true" ]; then
              echo "replace=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release $tag already exists; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-python@v5
        if: steps.version.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Run tests
        if: steps.version.outputs.skip != 'true'
        run: python -m pytest -q
      - name: Download packages to ship with the release
        if: steps.version.outputs.skip != 'true'
        run: "pip download -r requirements.txt -c requirements.lock --only-binary=:all: -d wheels"
      - name: Build release archive
        if: steps.version.outputs.skip != 'true'
        run: python tools/package_release.py
      - name: Release notes from CHANGELOG
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          sum="$(cut -d' ' -f1 "dist/relay-panel-${TAG}.tar.gz.sha256")"
          {
            echo
            echo "## Install or update"
            echo
            echo '```bash'
            echo "bash <(curl -Ls https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install-online.sh) --version ${TAG}"
            echo '```'
            echo
            echo "SHA-256 of \`relay-panel-${TAG}.tar.gz\`: \`${sum}\`"
          } >> notes.md
      - name: Publish GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPLACE: ${{ steps.version.outputs.replace }}
        run: |
          if [ "$REPLACE" = "true" ]; then
            # Same version, new build: remove the old release and its tag, then publish again.
            gh release delete "$TAG" --cleanup-tag --yes
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
          fi
          gh release create "$TAG" \
            "dist/relay-panel-${TAG}.tar.gz" \
            "dist/relay-panel-${TAG}.tar.gz.sha256" \
            --target "$GITHUB_SHA" --title "Relay ${TAG}" --notes-file notes.md --latest
